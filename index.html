<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MSFLib Docs</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-border: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
        --accent-strong: #0ea5e9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, #172033 0%, var(--bg) 45%);
        color: var(--text);
      }
      .card {
        width: min(720px, calc(100vw - 2rem));
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.45);
        padding: 2.5rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      a {
        display: inline-block;
        padding: 0.8rem 1.1rem;
        border-radius: 999px;
        background: linear-gradient(
          135deg,
          var(--accent),
          var(--accent-strong)
        );
        color: white;
        text-decoration: none;
        font-weight: 600;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }
      a:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }
      .secondary {
        background: transparent;
        border: 1px solid var(--panel-border);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>MSFLib Docs</h1>
      <p>
        This is the root documentation landing page. The main generated FastAPI
        documentation is available below.
      </p>
      <div class="links">
        <a href="./fastapi/">Open FastAPI docs</a>
        <a class="secondary" href="./fastapi/quickstart/">Quickstart</a>
      </div>
    </main>
  </body>
</html>
